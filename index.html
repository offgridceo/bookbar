<!DOCTYPE html>
<html lang="en" data-theme="maroon" data-font="sans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOKBAR</title>
    <style>
        /* --- SYSTEM DESIGN & CSS VARIABLES --- */
        :root {
            --bg-base: #0a0a0a;
            --bg-surface: #121212;
            --bg-element: #1a1a1a;
            --border-color: #262626;
            --text-main: #e5e5e5;
            --text-muted: #737373;
            
            --accent: #800020;
            --folder-border: var(--accent);
            --folder-bg: rgba(128, 0, 32, 0.05);

            --grid-size: 100px;
            --grid-pattern: radial-gradient(var(--border-color) 1px, transparent 1px);
            --grid-bg-size: 20px 20px;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Font Theme Overrides */
        [data-font="mono"] { --font-stack: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
        [data-font="serif"] { --font-stack: Georgia, Cambria, "Times New Roman", Times, serif; }
        [data-font="sans"] { --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        /* --- 20 DISTINCT THEME PRESETS --- */
        [data-theme="maroon"] { --bg-base: #0a0a0a; --bg-surface: #121212; --bg-element: #1a1a1a; --border-color: #262626; --text-main: #e5e5e5; --text-muted: #737373; --accent: #800020; --folder-bg: rgba(128, 0, 32, 0.08); --folder-border: #800020; --grid-pattern: radial-gradient(#262626 1px, transparent 1px); }
        [data-theme="grey"] { --bg-base: #0f0f0f; --bg-surface: #181818; --bg-element: #222222; --border-color: #333333; --text-main: #d4d4d4; --text-muted: #666666; --accent: #525252; --folder-bg: rgba(82, 82, 82, 0.1); --folder-border: #525252; --grid-pattern: radial-gradient(#333333 1px, transparent 1px); }
        [data-theme="neon"] { --bg-base: #050b07; --bg-surface: #0a140d; --bg-element: #102015; --border-color: #1a3821; --text-main: #00ff66; --text-muted: #008033; --accent: #00ff66; --folder-bg: rgba(0, 255, 102, 0.05); --folder-border: #00ff66; --grid-pattern: radial-gradient(#1a3821 1px, transparent 1px); }
        [data-theme="outline"] { --bg-base: #000000; --bg-surface: #0d0d0d; --bg-element: #171717; --border-color: #404040; --text-main: #ffffff; --text-muted: #737373; --accent: #ffffff; --folder-bg: transparent; --folder-border: #737373; --grid-pattern: radial-gradient(#404040 1px, transparent 1px); }
        [data-theme="cyberpunk"] { --bg-base: #0d021a; --bg-surface: #17052e; --bg-element: #240847; --border-color: #470d8a; --text-main: #ff007f; --text-muted: #8c00ed; --accent: #00f0ff; --folder-bg: rgba(0, 240, 255, 0.08); --folder-border: #ff007f; --grid-pattern: linear-gradient(rgba(71, 13, 138, 0.3) 1px, transparent 1px), linear-gradient(90deg, rgba(71, 13, 138, 0.3) 1px, transparent 1px); }
        [data-theme="hacker"] { --bg-base: #000000; --bg-surface: #050f05; --bg-element: #0a1f0a; --border-color: #003b00; --text-main: #00ff41; --text-muted: #007a1f; --accent: #00ff41; --folder-bg: rgba(0, 255, 65, 0.05); --folder-border: #00ff41; --grid-pattern: linear-gradient(rgba(0, 59, 0, 0.4) 1px, transparent 1px); }
        [data-theme="tactical"] { --bg-base: #111411; --bg-surface: #1a1e1a; --bg-element: #242a24; --border-color: #353d35; --text-main: #a3b19b; --text-muted: #5e6859; --accent: #6b7c5d; --folder-bg: rgba(107, 124, 93, 0.1); --folder-border: #6b7c5d; --grid-pattern: radial-gradient(#353d35 1.5px, transparent 1.5px); }
        [data-theme="coding"] { --bg-base: #1e1e1e; --bg-surface: #252526; --bg-element: #2d2d2d; --border-color: #3e3e42; --text-main: #d4d4d4; --text-muted: #858585; --accent: #007acc; --folder-bg: rgba(0, 122, 204, 0.1); --folder-border: #007acc; --grid-pattern: radial-gradient(#3e3e42 1px, transparent 1px); }
        [data-theme="pastel"] { --bg-base: #120e16; --bg-surface: #1b1522; --bg-element: #281f33; --border-color: #3e304f; --text-main: #f3d5ec; --text-muted: #9a789c; --accent: #f3a0e2; --folder-bg: rgba(243, 160, 226, 0.08); --folder-border: #f3a0e2; --grid-pattern: radial-gradient(#3e304f 1px, transparent 1px); }
        [data-theme="glitch"] { --bg-base: #030303; --bg-surface: #0a0a0c; --bg-element: #121217; --border-color: #ff003c; --text-main: #00f6ff; --text-muted: #730029; --accent: #ff003c; --folder-bg: rgba(255, 0, 60, 0.08); --folder-border: #00f6ff; --grid-pattern: linear-gradient(rgba(255, 0, 60, 0.2) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 246, 255, 0.2) 1px, transparent 1px); }
        [data-theme="pulse"] { --bg-base: #060514; --bg-surface: #0d0a26; --bg-element: #16123d; --border-color: #2b226e; --text-main: #b8adff; --text-muted: #5e52a8; --accent: #7a5cff; --folder-bg: rgba(122, 92, 255, 0.1); --folder-border: #7a5cff; --grid-pattern: radial-gradient(#2b226e 1px, transparent 1px); }
        [data-theme="amber"] { --bg-base: #0d0800; --bg-surface: #170e00; --bg-element: #241600; --border-color: #422800; --text-main: #ffb000; --text-muted: #855c00; --accent: #ffb000; --folder-bg: rgba(255, 176, 0, 0.08); --folder-border: #ffb000; --grid-pattern: linear-gradient(rgba(66, 40, 0, 0.4) 1px, transparent 1px); }
        [data-theme="minimal-mono"] { --bg-base: #ffffff; --bg-surface: #f4f4f5; --bg-element: #e4e4e7; --border-color: #d4d4d8; --text-main: #09090b; --text-muted: #71717a; --accent: #09090b; --folder-bg: rgba(9, 9, 11, 0.05); --folder-border: #09090b; --grid-pattern: radial-gradient(#d4d4d8 1px, transparent 1px); }
        [data-theme="crimson"] { --bg-base: #0f0505; --bg-surface: #1a0a0a; --bg-element: #291010; --border-color: #471c1c; --text-main: #ff8080; --text-muted: #8a3636; --accent: #ff3333; --folder-bg: rgba(255, 51, 51, 0.08); --folder-border: #ff3333; --grid-pattern: radial-gradient(#471c1c 1px, transparent 1px); }
        [data-theme="nord"] { --bg-base: #2e3440; --bg-surface: #3b4252; --bg-element: #434c5e; --border-color: #4c566a; --text-main: #eceff4; --text-muted: #d8dee9; --accent: #88c0d0; --folder-bg: rgba(136, 192, 208, 0.1); --folder-border: #88c0d0; --grid-pattern: radial-gradient(#4c566a 1px, transparent 1px); }
        [data-theme="dracula"] { --bg-base: #282a36; --bg-surface: #343746; --bg-element: #44475a; --border-color: #6272a4; --text-main: #f8f8f2; --text-muted: #6272a4; --accent: #ff79c6; --folder-bg: rgba(255, 121, 198, 0.1); --folder-border: #bd93f9; --grid-pattern: radial-gradient(#6272a4 1px, transparent 1px); }
        [data-theme="midnight"] { --bg-base: #020617; --bg-surface: #0f172a; --bg-element: #1e293b; --border-color: #334155; --text-main: #f8fafc; --text-muted: #64748b; --accent: #38bdf8; --folder-bg: rgba(56, 189, 248, 0.08); --folder-border: #38bdf8; --grid-pattern: radial-gradient(#334155 1px, transparent 1px); }
        [data-theme="emerald"] { --bg-base: #022c22; --bg-surface: #064e3b; --bg-element: #047857; --border-color: #059669; --text-main: #ecfdf5; --text-muted: #6ee7b7; --accent: #10b981; --folder-bg: rgba(16, 185, 129, 0.12); --folder-border: #34d399; --grid-pattern: radial-gradient(#059669 1px, transparent 1px); }
        [data-theme="solarized"] { --bg-base: #002b36; --bg-surface: #073642; --bg-element: #586e75; --border-color: #657b83; --text-main: #fdf6e3; --text-muted: #93a1a1; --accent: #b58900; --folder-bg: rgba(181, 137, 0, 0.15); --folder-border: #cb4b16; --grid-pattern: radial-gradient(#657b83 1px, transparent 1px); }
        [data-theme="synthwave"] { --bg-base: #1a102f; --bg-surface: #241744; --bg-element: #32205d; --border-color: #4b3080; --text-main: #ffe600; --text-muted: #a670ff; --accent: #ff007f; --folder-bg: rgba(255, 0, 127, 0.12); --folder-border: #00f0ff; --grid-pattern: linear-gradient(rgba(75, 48, 128, 0.4) 1px, transparent 1px), linear-gradient(90deg, rgba(75, 48, 128, 0.4) 1px, transparent 1px); }

        /* --- BASE STYLES --- */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-stack);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Canvas Grid Visualizer */
        #desktop-canvas {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: var(--grid-pattern);
            background-size: var(--grid-bg-size);
        }

        /* --- DESKTOP ITEMS (ICONS) --- */
        .desktop-item {
            position: absolute;
            width: 84px;
            height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: grab;
            padding: 4px;
            border-radius: 4px;
            border: 1px solid transparent;
            transition: background 0.1s ease, border 0.1s ease;
            z-index: 2;
        }
        .desktop-item:active { cursor: grabbing; }
        .desktop-item:hover {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
        }

        /* Drop Target Highlighting */
        .desktop-item.drop-hover {
            background: rgba(255, 255, 255, 0.08) !important;
            border: 1px dashed var(--accent) !important;
        }

        /* Folder Aesthetic */
        .item-folder .icon-wrapper {
            width: 42px;
            height: 34px;
            background: var(--folder-bg);
            border: 2px solid var(--folder-border);
            border-radius: 4px;
            position: relative;
            margin-bottom: 6px;
        }
        .item-folder .icon-wrapper::before {
            content: '';
            position: absolute;
            top: -6px;
            left: -2px;
            width: 16px;
            height: 6px;
            background: var(--folder-border);
            border-radius: 2px 2px 0 0;
        }
        [data-theme="outline"] .item-folder .icon-wrapper {
            border-style: dashed;
        }

        /* Link Aesthetic */
        .item-link .icon-wrapper {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }
        .item-link img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            image-rendering: crisp-edges;
        }

        .item-label {
            font-size: 11px;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-main);
        }

        /* --- OS WINDOW / MODAL SYSTEM --- */
        .window {
            position: absolute;
            top: 15%;
            left: 25%;
            width: 500px;
            height: 360px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            z-index: 10;
            border-radius: 6px;
        }
        .window-header {
            background: var(--bg-element);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            cursor: move;
        }
        .window-title-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .window-back-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 2px 6px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
        }
        .window-back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .window-title {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-main);
        }
        .window-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
        }
        .window-close:hover { color: var(--accent); }
        .window-content {
            padding: 16px;
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
            grid-gap: 16px;
            align-content: start;
            position: relative;
        }

        /* Drag Proxy for Drag Out */
        #drag-proxy {
            position: fixed;
            pointer-events: none;
            z-index: 2000;
            display: none;
            opacity: 0.85;
            transform: translate(-50%, -50%);
        }

        /* --- HOVER PREVIEW SNAPSHOT CARD --- */
        #hover-preview-card {
            position: fixed;
            pointer-events: none;
            z-index: 2500;
            display: none;
            width: 250px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            box-shadow: 0 15px 35px rgba(0,0,0,0.85);
            border-radius: 6px;
            overflow: hidden;
            flex-direction: column;
        }
        #hover-preview-card img {
            width: 100%;
            height: 135px;
            object-fit: cover;
            background: var(--bg-base);
        }
        #hover-preview-card .preview-footer {
            padding: 8px 10px;
            font-size: 10px;
            color: var(--text-main);
            background: var(--bg-element);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            border-top: 1px solid var(--border-color);
        }

        /* --- CONTEXT MENU --- */
        #context-menu {
            position: absolute;
            display: none;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            z-index: 100;
            width: 170px;
            padding: 4px 0;
            border-radius: 4px;
        }
        .menu-item {
            padding: 8px 12px;
            font-size: 12px;
            cursor: pointer;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
        }
        .menu-item:hover {
            background: var(--bg-element);
            color: var(--accent);
        }
        .menu-separator {
            height: 1px;
            background: var(--border-color);
            margin: 4px 0;
        }

        /* --- COMMAND PALETTE (SEARCH) --- */
        #search-palette {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            z-index: 200;
            display: none;
            flex-direction: column;
            border-radius: 8px;
            overflow: hidden;
        }
        #search-input {
            width: 100%;
            padding: 16px;
            background: var(--bg-base);
            border: none;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            font-family: var(--font-stack);
        }
        #search-results {
            max-height: 250px;
            overflow-y: auto;
            padding: 8px 0;
        }
        .search-result-item {
            padding: 10px 16px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-result-item.selected, .search-result-item:hover {
            background: var(--bg-element);
            color: var(--accent);
        }

        /* --- TAGS DRAWER / MODAL --- */
        #tags-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
            width: 440px;
            z-index: 160;
            display: none;
            flex-direction: column;
            border-radius: 8px;
            overflow: hidden;
        }
        #tags-header {
            padding: 12px 16px;
            background: var(--bg-element);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        #tags-search-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-base);
            border: none;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            font-family: var(--font-stack);
        }
        #tags-results-list {
            max-height: 280px;
            overflow-y: auto;
            padding: 8px 0;
        }

        /* --- CONTROLS / SETTINGS SYSTEM --- */
        #corner-widgets {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 5;
        }
        .widget-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 4px;
        }
        .widget-btn:hover { border-color: var(--accent); }

        #settings-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 24px;
            width: 320px;
            z-index: 150;
            display: none;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            border-radius: 6px;
        }
        .settings-group { margin-bottom: 18px; }
        .settings-label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; display: block; letter-spacing: 0.5px;}
        .settings-select {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px;
            font-size: 12px;
            outline: none;
            border-radius: 4px;
        }

        /* Global Overlay Form for Creation / Credentials Inputs */
        #prompt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .prompt-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 20px;
            width: 340px;
            border-radius: 6px;
        }
        .prompt-card h3 { font-size: 12px; text-transform: uppercase; margin-bottom: 12px; color: var(--text-muted); }
        .prompt-card input {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px;
            font-size: 13px;
            outline: none;
            margin-bottom: 12px;
            border-radius: 4px;
        }
        .prompt-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    </style>
</head>
<body>

    <!-- Main Active Canvas Layout -->
    <div id="desktop-canvas"></div>

    <!-- Drag Proxy for Items Dragged Out of Window -->
    <div id="drag-proxy" class="desktop-item"></div>

    <!-- Floating Automated Hover Preview Snapshot Window -->
    <div id="hover-preview-card">
        <img id="preview-card-img" src="" alt="Media Preview">
        <div class="preview-footer" id="preview-card-label">Loading Snapshot...</div>
    </div>

    <!-- Right-Click Action Context Menu -->
    <div id="context-menu">
        <div class="menu-item" onclick="openPrompt('folder')">New Folder</div>
        <div class="menu-item" onclick="openPrompt('link')">New Bookmark</div>
        <div class="menu-separator"></div>
        <div class="menu-item" onclick="toggleSettings(true)">System Configurations</div>
    </div>

    <!-- Omnipresent Command Palette / Quick Lookup -->
    <div id="search-palette">
        <input type="text" id="search-input" placeholder="Search entries... (Return to launch)" autocomplete="off">
        <div id="search-results"></div>
    </div>

    <!-- Dedicated Visual Tags Finder Modal -->
    <div id="tags-modal">
        <div id="tags-header">
            <span>Tag Search & Filter Engine</span>
            <button class="window-close" onclick="toggleTagsModal(false)">✕</button>
        </div>
        <input type="text" id="tags-search-input" placeholder="Type tag descriptor... (e.g. hypno)" autocomplete="off">
        <div id="tags-results-list"></div>
    </div>

    <!-- Global Application Dynamic Prompt Engine -->
    <div id="prompt-overlay">
        <div class="prompt-card">
            <h3 id="prompt-title">Create Entry</h3>
            <input type="text" id="prompt-input-1" placeholder="">
            <input type="text" id="prompt-input-2" placeholder="" style="display:none;">
            <div class="prompt-buttons">
                <button class="widget-btn" onclick="closePrompt()">Cancel</button>
                <button class="widget-btn" id="prompt-confirm" style="background:var(--bg-element); border-color:var(--accent);">Execute</button>
            </div>
        </div>
    </div>

    <!-- Custom System Configurations Window -->
    <div id="settings-modal">
        <div class="settings-group">
            <span class="settings-label">Typography Core</span>
            <select id="setting-font" class="settings-select" onchange="updateFont(this.value)">
                <option value="sans">Modern Sans-Serif</option>
                <option value="mono">Clinical Monospace</option>
                <option value="serif">Structural Serif</option>
            </select>
        </div>
        <div class="settings-group">
            <span class="settings-label">Visual Theme / Preset Variant</span>
            <select id="setting-theme" class="settings-select" onchange="updateTheme(this.value)">
                <option value="maroon">01. Signature Maroon</option>
                <option value="grey">02. Muted Charcoal</option>
                <option value="neon">03. Matrix Neon</option>
                <option value="outline">04. Raw Architecture</option>
                <option value="cyberpunk">05. Cyberpunk Neon</option>
                <option value="hacker">06. Hacker Terminal</option>
                <option value="tactical">07. Tactical Slate</option>
                <option value="coding">08. VS Code Dark</option>
                <option value="pastel">09. Pastel Vamp</option>
                <option value="glitch">10. Chromatic Glitch</option>
                <option value="pulse">11. Violet Pulse</option>
                <option value="amber">12. Amber CRT Arcade</option>
                <option value="minimal-mono">13. Minimal Light Mono</option>
                <option value="crimson">14. Crimson Deep</option>
                <option value="nord">15. Nord Ice</option>
                <option value="dracula">16. Dracula Synth</option>
                <option value="midnight">17. Midnight Slate</option>
                <option value="emerald">18. Emerald Vault</option>
                <option value="solarized">19. Solarized Dark</option>
                <option value="synthwave">20. Synthwave 84</option>
            </select>
        </div>
        <div style="display:flex; gap:10px; margin-top:24px;">
            <button class="widget-btn" style="flex:1" onclick="exportData()">Export Data</button>
            <button class="widget-btn" style="flex:1" onclick="triggerImport()">Import Data</button>
        </div>
        <input type="file" id="import-file-holder" style="display:none" onchange="importData(event)">
        <button class="widget-btn" style="width:100%; margin-top:10px;" onclick="toggleSettings(false)">Close Panel</button>
    </div>

    <!-- UI Interaction Utilities Block -->
    <div id="corner-widgets">
        <button class="widget-btn" onclick="toggleTagsModal(true)">Tags</button>
        <button class="widget-btn" onclick="toggleSettings(true)">Config</button>
    </div>

    <script>
        // --- MEMORY ARCHITECTURE & SEED DATA ---
        let state = {
            items: [],
            config: { theme: 'maroon', font: 'sans' }
        };

        const GRID = 20; 
        let activeDragElement = null;
        let isDraggingFromWindow = false;
        let dragOffset = { x: 0, y: 0 };
        let searchIndex = 0;

        let spawnCoordinates = { x: 40, y: 40 };
        let folderHistoryStack = [];
        let creationTargetParentId = null;

        let hoverTimer = null;
        let activeHoverUrl = null;

        function initMemory() {
            const stored = localStorage.getItem('BOOKBAR_DATA');
            if (stored) {
                try {
                    state = JSON.parse(stored);
                } catch(e) {
                    console.error("Memory corrupted, resetting layout.", e);
                }
            } else {
                state.items = [
                    { id: '1', type: 'folder', label: 'Development', x: 40, y: 40, parentId: null },
                    { id: '2', type: 'link', label: 'GitHub', url: 'https://github.com', x: 40, y: 160, parentId: null, tags: ['coding', 'git'] }
                ];
            }
            applyConfig();
            renderCanvas();
        }

        function saveMemory() {
            localStorage.setItem('BOOKBAR_DATA', JSON.stringify(state));
        }

        function applyConfig() {
            document.documentElement.setAttribute('data-theme', state.config.theme || 'maroon');
            document.documentElement.setAttribute('data-font', state.config.font || 'sans');
            document.getElementById('setting-theme').value = state.config.theme || 'maroon';
            document.getElementById('setting-font').value = state.config.font || 'sans';
        }

        function updateTheme(val) { state.config.theme = val; saveMemory(); applyConfig(); }
        function updateFont(val) { state.config.font = val; saveMemory(); applyConfig(); }

        // --- CORE UI RENDERING ENGINE ---
        const canvas = document.getElementById('desktop-canvas');
        const dragProxy = document.getElementById('drag-proxy');
        const previewCard = document.getElementById('hover-preview-card');
        const previewCardImg = document.getElementById('preview-card-img');
        const previewCardLabel = document.getElementById('preview-card-label');

        function generateIconHTML(item) {
            if (item.type === 'folder') {
                return `<div class="icon-wrapper"></div><div class="item-label">${item.label}</div>`;
            } else {
                const favUrl = `https://www.google.com/s2/favicons?sz=64&domain=${item.url}`;
                return `<div class="icon-wrapper"><img src="${favUrl}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2216%22 height=%2216%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23737373%22 stroke-width=%222%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22></circle></svg>'"></div><div class="item-label">${item.label}</div>`;
            }
        }

        function renderCanvas() {
            const rootItems = canvas.querySelectorAll('.desktop-item');
            rootItems.forEach(el => el.remove());

            state.items.filter(i => i.parentId === null).forEach(item => {
                const el = document.createElement('div');
                el.className = `desktop-item item-${item.type}`;
                el.id = `item-${item.id}`;
                el.style.left = `${item.x}px`;
                el.style.top = `${item.y}px`;
                el.innerHTML = generateIconHTML(item);
                
                attachItemEvents(el, item, false);
                canvas.appendChild(el);
            });
        }

        function renderWindowContent(folderId, contentEl) {
            contentEl.innerHTML = '';
            const children = state.items.filter(i => i.parentId === folderId);
            if(children.length === 0) {
                contentEl.innerHTML = `<div style="grid-column: 1/-1; text-align:center; font-size:11px; color:var(--text-muted); margin-top:40px; text-transform:uppercase;">Empty Folder Container</div>`;
                return;
            }
            children.forEach(item => {
                const el = document.createElement('div');
                el.className = `desktop-item item-${item.type}`;
                el.style.position = 'relative';
                el.style.left = '0px';
                el.style.top = '0px';
                el.id = `item-${item.id}`;
                el.innerHTML = generateIconHTML(item);
                attachItemEvents(el, item, true);
                contentEl.appendChild(el);
            });
        }

        // --- INTERACTION, DRAG-AND-DROP & HOVER PREVIEWS LOGIC ---
        function attachItemEvents(el, item, insideWindow = false) {
            el.addEventListener('contextmenu', (e) => {
                hideHoverPreview();
                e.stopPropagation();
                e.preventDefault();
                showDeleteMenu(e, item.id);
            });

            el.addEventListener('mousedown', (e) => {
                hideHoverPreview();
                if (e.button !== 0) return; 
                e.stopPropagation();
                activeDragElement = item;
                isDraggingFromWindow = insideWindow;

                const rect = el.getBoundingClientRect();
                dragOffset.x = e.clientX - rect.left;
                dragOffset.y = e.clientY - rect.top;

                if (insideWindow) {
                    dragProxy.className = `desktop-item item-${item.type}`;
                    dragProxy.innerHTML = generateIconHTML(item);
                    dragProxy.style.display = 'flex';
                    dragProxy.style.left = `${e.clientX}px`;
                    dragProxy.style.top = `${e.clientY}px`;
                } else {
                    el.style.zIndex = 1000;
                }
            });

            el.addEventListener('mouseenter', (e) => {
                if (item.type !== 'link' || activeDragElement) return;
                
                hoverTimer = setTimeout(() => {
                    const rect = el.getBoundingClientRect();
                    showHoverPreview(item, rect.right + 15, rect.top);
                }, 200); // Fast 0.2s hover threshold
            });

            el.addEventListener('mouseleave', () => {
                hideHoverPreview();
            });

            el.addEventListener('click', (e) => {
                e.stopPropagation();
            });

            el.addEventListener('dblclick', (e) => {
                hideHoverPreview();
                e.stopPropagation();
                if (item.type === 'folder') {
                    const singleWin = document.getElementById('single-system-window');
                    if (singleWin) {
                        folderHistoryStack.push(item.id);
                        updateWindowView(item.id);
                    } else {
                        launchFolderWindow(item.id);
                    }
                } else {
                    window.open(item.url, '_blank', 'noopener,noreferrer');
                }
            });
        }

        async function showHoverPreview(item, x, y) {
            if (!item.url) return;
            activeHoverUrl = item.url;
            
            if (x + 260 > window.innerWidth) x = window.innerWidth - 270;
            if (y + 180 > window.innerHeight) y = window.innerHeight - 190;

            previewCard.style.left = `${x}px`;
            previewCard.style.top = `${y}px`;
            previewCard.style.display = 'flex';
            
            previewCardLabel.innerText = item.label;

            // Extract high-res OpenGraph metadata thumbnail via Microlink API
            try {
                const apiRes = await fetch(`https://api.microlink.io/?url=${encodeURIComponent(item.url)}`);
                const json = await apiRes.json();
                
                if (activeHoverUrl !== item.url) return; // Prevent stale overwriting

                if (json.status === 'success' && json.data.image && json.data.image.url) {
                    previewCardImg.src = json.data.image.url;
                    if (json.data.title) previewCardLabel.innerText = json.data.title;
                } else {
                    // Fallback to high-res favicon if OpenGraph image unavailable
                    previewCardImg.src = `https://www.google.com/s2/favicons?sz=128&domain=${item.url}`;
                }
            } catch(e) {
                if (activeHoverUrl === item.url) {
                    previewCardImg.src = `https://www.google.com/s2/favicons?sz=128&domain=${item.url}`;
                }
            }
        }

        function hideHoverPreview() {
            if (hoverTimer) clearTimeout(hoverTimer);
            activeHoverUrl = null;
            previewCard.style.display = 'none';
        }

        window.addEventListener('mousemove', (e) => {
            if (!activeDragElement) return;

            if (isDraggingFromWindow) {
                dragProxy.style.left = `${e.clientX}px`;
                dragProxy.style.top = `${e.clientY}px`;
            } else {
                const el = document.getElementById(`item-${activeDragElement.id}`);
                if (!el) return;

                let targetX = e.clientX - dragOffset.x;
                let targetY = e.clientY - dragOffset.y;

                el.style.left = `${targetX}px`;
                el.style.top = `${targetY}px`;

                document.querySelectorAll('.desktop-item.item-folder').forEach(folderEl => {
                    if (folderEl.id === `item-${activeDragElement.id}`) return;
                    const rect = folderEl.getBoundingClientRect();
                    if (e.clientX >= rect.left && e.clientX <= rect.right &&
                        e.clientY >= rect.top && e.clientY <= rect.bottom) {
                        folderEl.classList.add('drop-hover');
                    } else {
                        folderEl.classList.remove('drop-hover');
                    }
                });
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (!activeDragElement) return;

            if (isDraggingFromWindow) {
                dragProxy.style.display = 'none';
                const activeWin = document.getElementById('single-system-window');
                let droppedOutsideWin = true;

                if (activeWin) {
                    const winRect = activeWin.getBoundingClientRect();
                    if (e.clientX >= winRect.left && e.clientX <= winRect.right &&
                        e.clientY >= winRect.top && e.clientY <= winRect.bottom) {
                        droppedOutsideWin = false;
                    }
                }

                if (droppedOutsideWin) {
                    let snappedX = Math.round((e.clientX - dragOffset.x) / GRID) * GRID;
                    let snappedY = Math.round((e.clientY - dragOffset.y) / GRID) * GRID;
                    if (snappedX < 0) snappedX = 0;
                    if (snappedY < 0) snappedY = 0;

                    const prevParentId = activeDragElement.parentId;
                    activeDragElement.parentId = null;
                    activeDragElement.x = snappedX;
                    activeDragElement.y = snappedY;

                    saveMemory();
                    renderCanvas();

                    if (prevParentId) {
                        const activeFolder = folderHistoryStack[folderHistoryStack.length - 1];
                        if (activeFolder) {
                            const contentEl = document.getElementById('single-win-content');
                            if (contentEl) renderWindowContent(activeFolder, contentEl);
                        }
                    }
                }
            } else {
                const el = document.getElementById(`item-${activeDragElement.id}`);
                if (el) {
                    let droppedIntoFolder = false;

                    document.querySelectorAll('.desktop-item.item-folder').forEach(folderEl => {
                        folderEl.classList.remove('drop-hover');
                        if (droppedIntoFolder || folderEl.id === `item-${activeDragElement.id}`) return;
                        
                        const rect = folderEl.getBoundingClientRect();
                        if (e.clientX >= rect.left && e.clientX <= rect.right &&
                            e.clientY >= rect.top && e.clientY <= rect.bottom) {
                            
                            const targetFolderId = folderEl.id.replace('item-', '');
                            activeDragElement.parentId = targetFolderId;
                            saveMemory();
                            droppedIntoFolder = true;
                            renderCanvas();

                            const activeFolder = folderHistoryStack[folderHistoryStack.length - 1];
                            if (activeFolder === targetFolderId) {
                                const contentEl = document.getElementById('single-win-content');
                                if (contentEl) renderWindowContent(targetFolderId, contentEl);
                            }
                        }
                    });

                    if (!droppedIntoFolder) {
                        let rawX = parseInt(el.style.left);
                        let rawY = parseInt(el.style.top);

                        let snappedX = Math.round(rawX / GRID) * GRID;
                        let snappedY = Math.round(rawY / GRID) * GRID;

                        if(snappedX < 0) snappedX = 0;
                        if(snappedY < 0) snappedY = 0;

                        el.style.left = `${snappedX}px`;
                        el.style.top = `${snappedY}px`;
                        el.style.zIndex = 2;

                        activeDragElement.x = snappedX;
                        activeDragElement.y = snappedY;
                        saveMemory();
                    }
                }
            }

            activeDragElement = null;
            isDraggingFromWindow = false;
        });

        // --- SINGLE-WINDOW NAVIGATION SYSTEM ---
        function launchFolderWindow(initialFolderId) {
            closeActiveWindow();

            folderHistoryStack = [initialFolderId];

            const win = document.createElement('div');
            win.className = 'window';
            win.id = 'single-system-window';
            win.style.left = '25%';
            win.style.top = '15%';

            win.innerHTML = `
                <div class="window-header">
                    <div class="window-title-area">
                        <button class="window-back-btn" id="win-back-btn" style="display:none;" onclick="navigateFolderBack()">← Back</button>
                        <span class="window-title" id="win-title-text"></span>
                    </div>
                    <button class="window-close" onclick="closeActiveWindow()">✕</button>
                </div>
                <div class="window-content" id="single-win-content"></div>
            `;

            win.addEventListener('contextmenu', (e) => {
                e.stopPropagation();
                e.preventDefault();
                const currentFolder = folderHistoryStack[folderHistoryStack.length - 1];
                creationTargetParentId = currentFolder;
                showContextMenu(e, true);
            });

            win.addEventListener('mousedown', (e) => {
                e.stopPropagation();
            });

            setupWindowDrag(win);
            document.body.appendChild(win);
            updateWindowView(initialFolderId);
        }

        function updateWindowView(folderId) {
            const folderObj = state.items.find(i => i.id === folderId);
            if (!folderObj) return;

            document.getElementById('win-title-text').innerText = folderObj.label;
            
            const backBtn = document.getElementById('win-back-btn');
            if (folderHistoryStack.length > 1) {
                backBtn.style.display = 'inline-block';
            } else {
                backBtn.style.display = 'none';
            }

            const contentEl = document.getElementById('single-win-content');
            renderWindowContent(folderId, contentEl);
        }

        function navigateFolderBack() {
            if (folderHistoryStack.length > 1) {
                folderHistoryStack.pop();
                const previousFolderId = folderHistoryStack[folderHistoryStack.length - 1];
                updateWindowView(previousFolderId);
            }
        }

        function closeActiveWindow() {
            const win = document.getElementById('single-system-window');
            if (win) win.remove();
            folderHistoryStack = [];
            creationTargetParentId = null;
        }

        function setupWindowDrag(win) {
            const header = win.querySelector('.window-header');
            let isDraggingWin = false;
            let winOffset = { x: 0, y: 0 };

            header.addEventListener('mousedown', (e) => {
                isDraggingWin = true;
                winOffset.x = e.clientX - win.offsetLeft;
                winOffset.y = e.clientY - win.offsetTop;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDraggingWin) return;
                win.style.left = `${e.clientX - winOffset.x}px`;
                win.style.top = `${e.clientY - winOffset.y}px`;
            });

            window.addEventListener('mouseup', () => { isDraggingWin = false; });
        }

        // --- CONTEXT MENUS & SMART CLIPBOARD PASTE ---
        const contextMenu = document.getElementById('context-menu');
        
        window.addEventListener('contextmenu', async (e) => {
            e.preventDefault();
            creationTargetParentId = null; 

            let snappedX = Math.round(e.clientX / GRID) * GRID;
            let snappedY = Math.round(e.clientY / GRID) * GRID;
            spawnCoordinates = { x: snappedX, y: snappedY };

            let copiedUrl = null;
            try {
                const clipText = await navigator.clipboard.readText();
                if (clipText && /^https?:\/\/[^\s]+$/i.test(clipText.trim())) {
                    copiedUrl = clipText.trim();
                }
            } catch(err) {
                // Clipboard permissions disabled or unreadable
            }

            showContextMenu(e, false, copiedUrl);
        });

        window.addEventListener('click', (e) => { 
            contextMenu.style.display = 'none'; 
            if (!e.target.closest('.window') && !e.target.closest('.desktop-item') && !e.target.closest('#prompt-overlay') && !e.target.closest('#context-menu') && !e.target.closest('#settings-modal') && !e.target.closest('#tags-modal')) {
                closeActiveWindow();
            }
        });

        function showContextMenu(e, isInsideWindow, pastedUrl = null) {
            contextMenu.style.display = 'block';
            contextMenu.style.left = `${e.clientX}px`;
            contextMenu.style.top = `${e.clientY}px`;
            
            let pasteOptionHTML = '';
            if (pastedUrl) {
                pasteOptionHTML = `<div class="menu-item" style="color:var(--accent);" onclick="quickPasteBookmark('${pastedUrl}', ${isInsideWindow})">Paste Bookmark</div><div class="menu-separator"></div>`;
            }

            contextMenu.innerHTML = `
                ${pasteOptionHTML}
                <div class="menu-item" onclick="openPrompt('folder', ${isInsideWindow})">New Folder</div>
                <div class="menu-item" onclick="openPrompt('link', ${isInsideWindow})">New Bookmark</div>
                <div class="menu-separator"></div>
                <div class="menu-item" onclick="toggleSettings(true)">System Configurations</div>
            `;
        }

        function quickPasteBookmark(url, insideWindow) {
            let domainLabel = 'New Bookmark';
            try {
                domainLabel = new URL(url).hostname.replace('www.', '');
            } catch(e) {}

            const newId = Date.now().toString();
            let parent = insideWindow ? creationTargetParentId : null;

            const newItem = {
                id: newId,
                type: 'link',
                label: domainLabel,
                url: url,
                parentId: parent,
                x: parent ? 0 : spawnCoordinates.x,
                y: parent ? 0 : spawnCoordinates.y,
                tags: []
            };

            state.items.push(newItem);
            saveMemory();
            
            if (parent) {
                const contentEl = document.getElementById('single-win-content');
                if (contentEl) renderWindowContent(parent, contentEl);
            } else {
                renderCanvas();
            }
        }

        function showDeleteMenu(e, id) {
            const item = state.items.find(i => i.id === id);
            contextMenu.style.display = 'block';
            contextMenu.style.left = `${e.clientX}px`;
            contextMenu.style.top = `${e.clientY}px`;
            
            let credsOptions = '';
            if (item && item.type === 'link') {
                credsOptions = `<div class="menu-item" onclick="openTagsPrompt('${id}')">Manage Tags</div>`;
                credsOptions += `<div class="menu-item" onclick="openCredentialsPrompt('${id}')">Manage Credentials</div>`;
                if (item.username) {
                    credsOptions += `<div class="menu-item" onclick="copyCreds('${id}', 'username')">Copy Username</div>`;
                }
                if (item.password) {
                    credsOptions += `<div class="menu-item" onclick="copyCreds('${id}', 'password')">Copy Password</div>`;
                }
                credsOptions += `<div class="menu-separator"></div>`;
            }

            contextMenu.innerHTML = `
                ${credsOptions}
                <div class="menu-item" onclick="openRenamePrompt('${id}')">Rename Entry</div>
                <div class="menu-separator"></div>
                <div class="menu-item" style="color:#ef4444;" onclick="deleteItem('${id}')">Purge Entry</div>
            `;
        }

        // --- TAG MANAGEMENT & SEARCH DRAWER ---
        function openTagsPrompt(id) {
            const item = state.items.find(i => i.id === id);
            if (!item) return;

            promptOverlay.style.display = 'flex';
            promptTitle.innerText = `Manage Tags: ${item.label}`;
            promptIn1.value = item.tags ? item.tags.join(', ') : '';
            promptIn1.placeholder = "Tags separated by commas (e.g. hypno, asmr)";
            promptIn2.style.display = 'none';
            promptIn1.focus();

            promptConfirm.onclick = function() {
                const rawVal = promptIn1.value.trim();
                if (rawVal) {
                    item.tags = rawVal.split(',').map(t => t.trim().toLowerCase().replace(/^#/, '')).filter(t => t.length > 0);
                } else {
                    item.tags = [];
                }
                saveMemory();
                closePrompt();
            };
        }

        function toggleTagsModal(show) {
            const tagsModal = document.getElementById('tags-modal');
            const searchInput = document.getElementById('tags-search-input');
            tagsModal.style.display = show ? 'flex' : 'none';
            if (show) {
                searchInput.value = '';
                renderTagsResults('');
                searchInput.focus();
            }
        }

        document.getElementById('tags-search-input').addEventListener('input', (e) => {
            renderTagsResults(e.target.value);
        });

        function renderTagsResults(query) {
            const resultsContainer = document.getElementById('tags-results-list');
            resultsContainer.innerHTML = '';

            const cleanQuery = query.toLowerCase().trim().replace(/^#/, '');

            const matches = state.items.filter(item => {
                if (item.type !== 'link') return false;
                if (!cleanQuery) return true;

                const hasMatchingTag = item.tags && item.tags.some(t => t.toLowerCase().includes(cleanQuery));
                const hasMatchingTitle = item.label.toLowerCase().includes(cleanQuery);
                return hasMatchingTag || hasMatchingTitle;
            });

            if (matches.length === 0) {
                resultsContainer.innerHTML = `<div style="padding:16px; text-align:center; font-size:11px; color:var(--text-muted); text-transform:uppercase;">No tagged bookmarks found matching query</div>`;
                return;
            }

            matches.forEach(item => {
                const el = document.createElement('div');
                el.className = 'search-result-item';
                
                const tagsBadges = (item.tags && item.tags.length > 0) 
                    ? item.tags.map(t => `#${t}`).join(' ') 
                    : 'no tags';

                const favUrl = `https://www.google.com/s2/favicons?sz=64&domain=${item.url}`;

                el.innerHTML = `
                    <img src="${favUrl}" style="width:16px; height:16px; object-fit:contain;" onerror="this.style.display='none'">
                    <span style="font-weight:500;">${item.label}</span>
                    <span style="margin-left:auto; font-size:10px; color:var(--text-muted); max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${tagsBadges}</span>
                `;

                el.addEventListener('click', () => {
                    toggleTagsModal(false);
                    window.open(item.url, '_blank', 'noopener,noreferrer');
                });

                resultsContainer.appendChild(el);
            });
        }

        // --- ACCOUNT VAULT & CREDENTIALS ENGINE ---
        function openCredentialsPrompt(id) {
            const item = state.items.find(i => i.id === id);
            if (!item) return;

            promptOverlay.style.display = 'flex';
            promptTitle.innerText = `Account Vault: ${item.label}`;
            promptIn1.value = item.username || '';
            promptIn2.value = item.password || '';
            promptIn1.placeholder = "Username / Email";
            promptIn2.placeholder = "Password / Secret Key";
            promptIn2.style.display = 'block';
            promptIn1.focus();

            promptConfirm.onclick = function() {
                item.username = promptIn1.value.trim();
                item.password = promptIn2.value.trim();
                saveMemory();
                closePrompt();
            };
        }

        function copyCreds(id, key) {
            const item = state.items.find(i => i.id === id);
            if (!item || !item[key]) return;
            navigator.clipboard.writeText(item[key]);
        }

        function openRenamePrompt(id) {
            const item = state.items.find(i => i.id === id);
            if (!item) return;

            activePromptType = 'rename';
            promptOverlay.style.display = 'flex';
            promptIn1.value = item.label;
            promptIn2.style.display = 'none';
            promptTitle.innerText = "Modify Entry Descriptor";
            promptIn1.focus();

            promptConfirm.onclick = function() {
                const newLabel = promptIn1.value.trim();
                if (!newLabel) return;
                item.label = newLabel;
                saveMemory();
                closePrompt();
                
                renderCanvas();
                const activeFolder = folderHistoryStack[folderHistoryStack.length - 1];
                if (activeFolder) {
                    const contentEl = document.getElementById('single-win-content');
                    if (contentEl) renderWindowContent(activeFolder, contentEl);
                }
                const activeWinTitle = document.getElementById('win-title-text');
                if (activeWinTitle && folderHistoryStack[folderHistoryStack.length - 1] === item.id) {
                    activeWinTitle.innerText = newLabel;
                }
            };
        }

        function deleteItem(id) {
            state.items = state.items.filter(i => i.id !== id && i.parentId !== id);
            saveMemory();
            renderCanvas();
            if (folderHistoryStack.includes(id)) {
                closeActiveWindow();
            } else {
                const activeFolder = folderHistoryStack[folderHistoryStack.length - 1];
                if (activeFolder) {
                    const contentEl = document.getElementById('single-win-content');
                    if (contentEl) renderWindowContent(activeFolder, contentEl);
                }
            }
        }

        // --- PROMPT ENGINE ---
        const promptOverlay = document.getElementById('prompt-overlay');
        const promptTitle = document.getElementById('prompt-title');
        const promptIn1 = document.getElementById('prompt-input-1');
        const promptIn2 = document.getElementById('prompt-input-2');
        const promptConfirm = document.getElementById('prompt-confirm');

        let activePromptType = 'folder';
        let activePromptInsideWindow = false;

        function openPrompt(type, insideWindow = false) {
            activePromptType = type;
            activePromptInsideWindow = insideWindow;
            promptOverlay.style.display = 'flex';
            promptIn1.value = '';
            promptIn2.value = '';

            promptConfirm.onclick = executeCreation;

            if (type === 'folder') {
                promptTitle.innerText = "Initialize Directory Cluster";
                promptIn1.placeholder = "Folder Descriptor Tag";
                promptIn2.style.display = 'none';
            } else {
                promptTitle.innerText = "Establish Target Entry Path";
                promptIn1.placeholder = "Bookmark Reference Tag";
                promptIn2.placeholder = "Absolute Pointer URI (https://...)";
                promptIn2.style.display = 'block';
            }
            promptIn1.focus();
        }

        function closePrompt() { promptOverlay.style.display = 'none'; }

        promptIn1.addEventListener('keydown', (e) => { if(e.key === 'Enter') promptConfirm.click(); });
        promptIn2.addEventListener('keydown', (e) => { if(e.key === 'Enter') promptConfirm.click(); });

        function executeCreation() {
            const label = promptIn1.value.trim();
            let url = promptIn2.value.trim();
            if (!label) return;

            const newId = Date.now().toString();
            let parent = activePromptInsideWindow ? creationTargetParentId : null;

            if (activePromptType === 'link') {
                if (!url) return;
                if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
            }

            const newItem = {
                id: newId,
                type: activePromptType,
                label: label,
                parentId: parent,
                x: parent ? 0 : spawnCoordinates.x,
                y: parent ? 0 : spawnCoordinates.y,
                tags: []
            };

            if (activePromptType === 'link') newItem.url = url;

            state.items.push(newItem);
            saveMemory();
            closePrompt();

            if (parent) {
                const contentEl = document.getElementById('single-win-content');
                if (contentEl) renderWindowContent(parent, contentEl);
            } else {
                renderCanvas();
            }
        }

        // --- COMMAND PALETTE ENGINE (CTRL + K) ---
        const searchPalette = document.getElementById('search-palette');
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        let filteredItems = [];

        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                if (searchPalette.style.display === 'flex') {
                    closeSearchPalette();
                } else {
                    searchPalette.style.display = 'flex';
                    searchInput.value = '';
                    searchResults.innerHTML = '';
                    searchInput.focus();
                    filteredItems = [];
                    searchIndex = 0;
                }
            }
            if (e.key === 'Escape') {
                closeSearchPalette();
                toggleSettings(false);
                toggleTagsModal(false);
            }
        });

        searchInput.addEventListener('input', () => {
            const query = searchInput.value.toLowerCase().trim();
            searchResults.innerHTML = '';
            searchIndex = 0;

            if (!query) { filteredItems = []; return; }

            filteredItems = state.items.filter(item => 
                item.label.toLowerCase().includes(query) || 
                (item.type === 'link' && item.url.toLowerCase().includes(query)) ||
                (item.tags && item.tags.some(t => t.toLowerCase().includes(query)))
            );

            if(filteredItems.length === 0) {
                searchResults.innerHTML = `<div style="padding:12px; font-size:11px; color:var(--text-muted); text-transform:uppercase;">No structural matches identified</div>`;
                return;
            }

            filteredItems.forEach((item, index) => {
                const el = document.createElement('div');
                el.className = `search-result-item ${index === 0 ? 'selected' : ''}`;
                
                if (item.type === 'folder') {
                    el.innerHTML = `📁 <span style="margin-left:5px;">${item.label}</span> <span style="margin-left:auto; font-size:10px; color:var(--text-muted);">DIRECTORY</span>`;
                } else {
                    el.innerHTML = `🔗 <span style="margin-left:5px;">${item.label}</span> <span style="margin-left:auto; font-size:10px; color:var(--text-muted); max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.url}</span>`;
                }

                el.addEventListener('click', () => triggerSearchSelection(item));
                searchResults.appendChild(el);
            });
        });

        searchInput.addEventListener('keydown', (e) => {
            if (filteredItems.length === 0) return;

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                changeSearchSelection(1);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                changeSearchSelection(-1);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                triggerSearchSelection(filteredItems[searchIndex]);
            }
        });

        function changeSearchSelection(dir) {
            const items = searchResults.querySelectorAll('.search-result-item');
            if(items.length === 0) return;
            items[searchIndex].classList.remove('selected');
            searchIndex = (searchIndex + dir + filteredItems.length) % filteredItems.length;
            items[searchIndex].classList.add('selected');
            items[searchIndex].scrollIntoView({ block: 'nearest' });
        }

        function triggerSearchSelection(item) {
            closeSearchPalette();
            if (item.type === 'folder') {
                launchFolderWindow(item.id);
            } else {
                window.open(item.url, '_blank', 'noopener,noreferrer');
            }
        }

        function closeSearchPalette() { searchPalette.style.display = 'none'; }

        // --- BACKUP & SETTINGS DATA ENGINE ---
        function toggleSettings(show) {
            document.getElementById('settings-modal').style.display = show ? 'block' : 'none';
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `bookbar_backup_${Date.now()}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function triggerImport() {
            document.getElementById('import-file-holder').click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.items && parsed.config) {
                        state = parsed;
                        saveMemory();
                        applyConfig();
                        renderCanvas();
                        closeActiveWindow();
                        toggleSettings(false);
                    } else {
                        alert("Malformed data architectural mapping signature.");
                    }
                } catch (err) {
                    alert("Execution fault reading payload file structure.");
                }
            };
            reader.readAsText(file);
        }

        // Start initialization process
        initMemory();
    </script>
</body>
</html>
