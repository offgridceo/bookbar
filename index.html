<!DOCTYPE html>
<html lang="en" data-theme="maroon" data-font="sans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOKBAR</title>
    <style>
        /* --- SYSTEM DESIGN & CSS VARIABLES --- */
        :root {
            --bg-base: #0a0a0a;
            --bg-surface: #121212;
            --bg-element: #1a1a1a;
            --border-color: #262626;
            --text-main: #e5e5e5;
            --text-muted: #737373;
            
            /* Accent Themes */
            --accent-maroon: #800020;
            --accent-grey: #525252;
            --accent-neon: #00ff66;
            --accent-outline: transparent;
            
            --accent: var(--accent-maroon);
            --folder-border: var(--accent);
            --folder-bg: rgba(128, 0, 32, 0.05);

            --grid-size: 100px;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Font Theme Overrides */
        [data-font="mono"] { --font-stack: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
        [data-font="serif"] { --font-stack: Georgia, Cambria, "Times New Roman", Times, serif; }
        [data-font="sans"] { --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        /* Accent Theme Overrides */
        [data-theme="grey"] { --accent: var(--accent-grey); --folder-bg: rgba(82, 82, 82, 0.1); --folder-border: var(--accent-grey); }
        [data-theme="neon"] { --accent: var(--accent-neon); --folder-bg: rgba(0, 255, 102, 0.03); --folder-border: var(--accent-neon); }
        [data-theme="outline"] { --accent: var(--text-main); --folder-bg: transparent; --folder-border: var(--text-muted); }
        [data-theme="maroon"] { --accent: var(--accent-maroon); --folder-bg: rgba(128, 0, 32, 0.05); --folder-border: var(--accent-maroon); }

        /* --- BASE STYLES --- */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-stack);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Canvas Grid Visualizer (Subtle alignment dots) */
        #desktop-canvas {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* --- DESKTOP ITEMS (ICONS) --- */
        .desktop-item {
            position: absolute;
            width: 84px;
            height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: grab;
            padding: 4px;
            border-radius: 4px;
            border: 1px solid transparent;
            transition: background 0.1s ease, border 0.1s ease;
            z-index: 2;
        }
        .desktop-item:active { cursor: grabbing; }
        .desktop-item:hover {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
        }

        /* Drop Target Highlighting */
        .desktop-item.drop-hover {
            background: rgba(255, 255, 255, 0.08) !important;
            border: 1px dashed var(--accent) !important;
        }

        /* Folder Aesthetic */
        .item-folder .icon-wrapper {
            width: 42px;
            height: 34px;
            background: var(--folder-bg);
            border: 2px solid var(--folder-border);
            border-radius: 4px;
            position: relative;
            margin-bottom: 6px;
        }
        .item-folder .icon-wrapper::before {
            content: '';
            position: absolute;
            top: -6px;
            left: -2px;
            width: 16px;
            height: 6px;
            background: var(--folder-border);
            border-radius: 2px 2px 0 0;
        }
        [data-theme="outline"] .item-folder .icon-wrapper {
            border-style: dashed;
        }

        /* Link Aesthetic */
        .item-link .icon-wrapper {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }
        .item-link img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            image-rendering: crisp-edges;
        }

        .item-label {
            font-size: 11px;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-main);
        }

        /* --- OS WINDOW / MODAL SYSTEM --- */
        .window {
            position: absolute;
            top: 15%;
            left: 25%;
            width: 500px;
            height: 360px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            z-index: 10;
            border-radius: 6px;
        }
        .window-header {
            background: var(--bg-element);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            cursor: move;
        }
        .window-title-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .window-back-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 2px 6px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
        }
        .window-back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .window-title {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-main);
        }
        .window-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
        }
        .window-close:hover { color: var(--accent); }
        .window-content {
            padding: 16px;
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
            grid-gap: 16px;
            align-content: start;
        }

        /* --- CONTEXT MENU --- */
        #context-menu {
            position: absolute;
            display: none;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            z-index: 100;
            width: 160px;
            padding: 4px 0;
            border-radius: 4px;
        }
        .menu-item {
            padding: 8px 12px;
            font-size: 12px;
            cursor: pointer;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
        }
        .menu-item:hover {
            background: var(--bg-element);
            color: var(--accent);
        }
        .menu-separator {
            height: 1px;
            background: var(--border-color);
            margin: 4px 0;
        }

        /* --- COMMAND PALETTE (SEARCH) --- */
        #search-palette {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            z-index: 200;
            display: none;
            flex-direction: column;
            border-radius: 8px;
            overflow: hidden;
        }
        #search-input {
            width: 100%;
            padding: 16px;
            background: var(--bg-base);
            border: none;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            font-family: var(--font-stack);
        }
        #search-results {
            max-height: 250px;
            overflow-y: auto;
            padding: 8px 0;
        }
        .search-result-item {
            padding: 10px 16px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-result-item.selected, .search-result-item:hover {
            background: var(--bg-element);
            color: var(--accent);
        }

        /* --- CONTROLS / SETTINGS SYSTEM --- */
        #corner-widgets {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 5;
        }
        .widget-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 4px;
        }
        .widget-btn:hover { border-color: var(--accent); }

        #settings-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 24px;
            width: 320px;
            z-index: 150;
            display: none;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            border-radius: 6px;
        }
        .settings-group { margin-bottom: 18px; }
        .settings-label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; display: block; letter-spacing: 0.5px;}
        .settings-select {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px;
            font-size: 12px;
            outline: none;
            border-radius: 4px;
        }

        /* Global Overlay Form for Creation Inputs */
        #prompt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .prompt-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 20px;
            width: 340px;
            border-radius: 6px;
        }
        .prompt-card h3 { font-size: 12px; text-transform: uppercase; margin-bottom: 12px; color: var(--text-muted); }
        .prompt-card input {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px;
            font-size: 13px;
            outline: none;
            margin-bottom: 16px;
            border-radius: 4px;
        }
        .prompt-buttons { display: flex; justify-content: flex-end; gap: 8px; }
    </style>
</head>
<body>

    <!-- Main Active Canvas Layout -->
    <div id="desktop-canvas"></div>

    <!-- Right-Click Action Context Menu -->
    <div id="context-menu">
        <div class="menu-item" onclick="openPrompt('folder')">New Folder</div>
        <div class="menu-item" onclick="openPrompt('link')">New Bookmark</div>
        <div class="menu-separator"></div>
        <div class="menu-item" onclick="toggleSettings(true)">System Configurations</div>
    </div>

    <!-- Omnipresent Command Palette / Quick Lookup -->
    <div id="search-palette">
        <input type="text" id="search-input" placeholder="Search entries... (Return to launch)" autocomplete="off">
        <div id="search-results"></div>
    </div>

    <!-- Global Application Dynamic Prompt Engine -->
    <div id="prompt-overlay">
        <div class="prompt-card">
            <h3 id="prompt-title">Create Entry</h3>
            <input type="text" id="prompt-input-1" placeholder="">
            <input type="text" id="prompt-input-2" placeholder="" style="display:none;">
            <div class="prompt-buttons">
                <button class="widget-btn" onclick="closePrompt()">Cancel</button>
                <button class="widget-btn" id="prompt-confirm" style="background:var(--bg-element); border-color:var(--accent);">Execute</button>
            </div>
        </div>
    </div>

    <!-- Custom System Configurations Window -->
    <div id="settings-modal">
        <div class="settings-group">
            <span class="settings-label">Typography Core</span>
            <select id="setting-font" class="settings-select" onchange="updateFont(this.value)">
                <option value="sans">Modern Sans-Serif</option>
                <option value="mono">Clinical Monospace</option>
                <option value="serif">Structural Serif</option>
            </select>
        </div>
        <div class="settings-group">
            <span class="settings-label">Visual Theme / Accent Variant</span>
            <select id="setting-theme" class="settings-select" onchange="updateTheme(this.value)">
                <option value="maroon">Signature Maroon</option>
                <option value="grey">Muted Charcoal</option>
                <option value="neon">Matrix Neon</option>
                <option value="outline">Raw Architecture</option>
            </select>
        </div>
        <div style="display:flex; gap:10px; margin-top:24px;">
            <button class="widget-btn" style="flex:1" onclick="exportData()">Export Data</button>
            <button class="widget-btn" style="flex:1" onclick="triggerImport()">Import Data</button>
        </div>
        <input type="file" id="import-file-holder" style="display:none" onchange="importData(event)">
        <button class="widget-btn" style="width:100%; margin-top:10px;" onclick="toggleSettings(false)">Close Panel</button>
    </div>

    <!-- UI Interaction Utilities Block -->
    <div id="corner-widgets">
        <button class="widget-btn" onclick="toggleSettings(true)">Config</button>
    </div>

    <script>
        // --- MEMORY ARCHITECTURE & SEED DATA ---
        let state = {
            items: [],
            config: { theme: 'maroon', font: 'sans' }
        };

        const GRID = 20; 
        let currentTargetFolderId = null; 
        let activeDragElement = null;
        let dragOffset = { x: 0, y: 0 };
        let searchIndex = 0;

        // Coordinates tracking for right-click positioning
        let spawnCoordinates = { x: 40, y: 40 };

        // Single window navigation history stack
        let folderHistoryStack = [];

        function initMemory() {
            const stored = localStorage.getItem('BOOKBAR_DATA');
            if (stored) {
                try {
                    state = JSON.parse(stored);
                } catch(e) {
                    console.error("Memory corrupted, resetting layout.", e);
                }
            } else {
                state.items = [
                    { id: '1', type: 'folder', label: 'Development', x: 40, y: 40, parentId: null },
                    { id: '2', type: 'link', label: 'GitHub', url: 'https://github.com', x: 40, y: 160, parentId: null }
                ];
            }
            applyConfig();
            renderCanvas();
        }

        function saveMemory() {
            localStorage.setItem('BOOKBAR_DATA', JSON.stringify(state));
        }

        function applyConfig() {
            document.documentElement.setAttribute('data-theme', state.config.theme || 'maroon');
            document.documentElement.setAttribute('data-font', state.config.font || 'sans');
            document.getElementById('setting-theme').value = state.config.theme || 'maroon';
            document.getElementById('setting-font').value = state.config.font || 'sans';
        }

        function updateTheme(val) { state.config.theme = val; saveMemory(); applyConfig(); }
        function updateFont(val) { state.config.font = val; saveMemory(); applyConfig(); }

        // --- CORE UI RENDERING ENGINE ---
        const canvas = document.getElementById('desktop-canvas');

        function generateIconHTML(item) {
            if (item.type === 'folder') {
                return `<div class="icon-wrapper"></div><div class="item-label">${item.label}</div>`;
            } else {
                const favUrl = `https://www.google.com/s2/favicons?sz=64&domain=${item.url}`;
                return `<div class="icon-wrapper"><img src="${favUrl}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2216%22 height=%2216%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23737373%22 stroke-width=%222%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22></circle></svg>'"></div><div class="item-label">${item.label}</div>`;
            }
        }

        function renderCanvas() {
            const rootItems = canvas.querySelectorAll('.desktop-item');
            rootItems.forEach(el => el.remove());

            state.items.filter(i => i.parentId === null).forEach(item => {
                const el = document.createElement('div');
                el.className = `desktop-item item-${item.type}`;
                el.id = `item-${item.id}`;
                el.style.left = `${item.x}px`;
                el.style.top = `${item.y}px`;
                el.innerHTML = generateIconHTML(item);
                
                attachItemEvents(el, item);
                canvas.appendChild(el);
            });
        }

        function renderWindowContent(folderId, contentEl) {
            contentEl.innerHTML = '';
            const children = state.items.filter(i => i.parentId === folderId);
            if(children.length === 0) {
                contentEl.innerHTML = `<div style="grid-column: 1/-1; text-align:center; font-size:11px; color:var(--text-muted); margin-top:40px; text-transform:uppercase;">Empty Folder Container</div>`;
                return;
            }
            children.forEach(item => {
                const el = document.createElement('div');
                el.className = `desktop-item item-${item.type}`;
                el.style.position = 'relative';
                el.style.left = '0px';
                el.style.top = '0px';
                el.innerHTML = generateIconHTML(item);
                attachItemEvents(el, item);
                contentEl.appendChild(el);
            });
        }

        // --- INTERACTION & DRAG-AND-DROP TO FOLDER LOGIC ---
        function attachItemEvents(el, item) {
            el.addEventListener('contextmenu', (e) => {
                e.stopPropagation();
                e.preventDefault();
                showDeleteMenu(e, item.id);
            });

            el.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return; 
                if (el.style.position === 'relative') return; // Ignore drag within active folder windows
                e.stopPropagation();
                activeDragElement = item;
                const rect = el.getBoundingClientRect();
                dragOffset.x = e.clientX - rect.left;
                dragOffset.y = e.clientY - rect.top;
                el.style.zIndex = 1000;
            });

            el.addEventListener('click', (e) => {
                e.stopPropagation();
            });

            el.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                if (item.type === 'folder') {
                    // Check if window is already open
                    const singleWin = document.getElementById('single-system-window');
                    if (singleWin) {
                        // Navigate INSIDE current window
                        folderHistoryStack.push(item.id);
                        updateWindowView(item.id);
                    } else {
                        // Open new single window container
                        launchFolderWindow(item.id);
                    }
                } else {
                    window.open(item.url, '_blank', 'noopener,noreferrer');
                }
            });
        }

        window.addEventListener('mousemove', (e) => {
            if (!activeDragElement) return;
            const el = document.getElementById(`item-${activeDragElement.id}`);
            if (!el) return;

            let targetX = e.clientX - dragOffset.x;
            let targetY = e.clientY - dragOffset.y;

            el.style.left = `${targetX}px`;
            el.style.top = `${targetY}px`;

            // Detect drag hovering over folders on desktop canvas
            document.querySelectorAll('.desktop-item.item-folder').forEach(folderEl => {
                if (folderEl.id === `item-${activeDragElement.id}`) return;
                const rect = folderEl.getBoundingClientRect();
                if (e.clientX >= rect.left && e.clientX <= rect.right &&
                    e.clientY >= rect.top && e.clientY <= rect.bottom) {
                    folderEl.classList.add('drop-hover');
                } else {
                    folderEl.classList.remove('drop-hover');
                }
            });
        });

        window.addEventListener('mouseup', (e) => {
            if (!activeDragElement) return;
            const el = document.getElementById(`item-${activeDragElement.id}`);
            if (el) {
                let droppedIntoFolder = false;

                // Detect if dropped on top of a folder
                document.querySelectorAll('.desktop-item.item-folder').forEach(folderEl => {
                    folderEl.classList.remove('drop-hover');
                    if (droppedIntoFolder || folderEl.id === `item-${activeDragElement.id}`) return;
                    
                    const rect = folderEl.getBoundingClientRect();
                    if (e.clientX >= rect.left && e.clientX <= rect.right &&
                        e.clientY >= rect.top && e.clientY <= rect.bottom) {
                        
                        const targetFolderId = folderEl.id.replace('item-', '');
                        activeDragElement.parentId = targetFolderId;
                        saveMemory();
                        droppedIntoFolder = true;
                        renderCanvas();

                        // Refresh window content if folder is open
                        const openContent = document.getElementById(`win-content-${targetFolderId}`);
                        if (openContent) renderWindowContent(targetFolderId, openContent);
                    }
                });

                if (!droppedIntoFolder) {
                    let rawX = parseInt(el.style.left);
                    let rawY = parseInt(el.style.top);

                    let snappedX = Math.round(rawX / GRID) * GRID;
                    let snappedY = Math.round(rawY / GRID) * GRID;

                    if(snappedX < 0) snappedX = 0;
                    if(snappedY < 0) snappedY = 0;

                    el.style.left = `${snappedX}px`;
                    el.style.top = `${snappedY}px`;
                    el.style.zIndex = 2;

                    activeDragElement.x = snappedX;
                    activeDragElement.y = snappedY;
                    saveMemory();
                }
            }
            activeDragElement = null;
        });

        // --- SINGLE-WINDOW NAVIGATION SYSTEM ---
        function launchFolderWindow(initialFolderId) {
            closeActiveWindow(); // Ensure single active window

            folderHistoryStack = [initialFolderId];

            const win = document.createElement('div');
            win.className = 'window';
            win.id = 'single-system-window';
            win.style.left = '25%';
            win.style.top = '15%';

            win.innerHTML = `
                <div class="window-header">
                    <div class="window-title-area">
                        <button class="window-back-btn" id="win-back-btn" style="display:none;" onclick="navigateFolderBack()">← Back</button>
                        <span class="window-title" id="win-title-text"></span>
                    </div>
                    <button class="window-close" onclick="closeActiveWindow()">✕</button>
                </div>
                <div class="window-content" id="single-win-content"></div>
            `;

            win.addEventListener('contextmenu', (e) => {
                e.stopPropagation();
                e.preventDefault();
                const currentFolder = folderHistoryStack[folderHistoryStack.length - 1];
                currentTargetFolderId = currentFolder;
                showContextMenu(e, true);
            });

            win.addEventListener('mousedown', (e) => {
                e.stopPropagation(); // Keep clicks inside window from closing it
            });

            setupWindowDrag(win);
            document.body.appendChild(win);
            updateWindowView(initialFolderId);
        }

        function updateWindowView(folderId) {
            const folderObj = state.items.find(i => i.id === folderId);
            if (!folderObj) return;

            document.getElementById('win-title-text').innerText = folderObj.label;
            
            const backBtn = document.getElementById('win-back-btn');
            if (folderHistoryStack.length > 1) {
                backBtn.style.display = 'inline-block';
            } else {
                backBtn.style.display = 'none';
            }

            const contentEl = document.getElementById('single-win-content');
            contentEl.id = `win-content-${folderId}`;
            renderWindowContent(folderId, contentEl);
        }

        function navigateFolderBack() {
            if (folderHistoryStack.length > 1) {
                folderHistoryStack.pop();
                const previousFolderId = folderHistoryStack[folderHistoryStack.length - 1];
                updateWindowView(previousFolderId);
            }
        }

        function closeActiveWindow() {
            const win = document.getElementById('single-system-window');
            if (win) win.remove();
            folderHistoryStack = [];
        }

        function setupWindowDrag(win) {
            const header = win.querySelector('.window-header');
            let isDraggingWin = false;
            let winOffset = { x: 0, y: 0 };

            header.addEventListener('mousedown', (e) => {
                isDraggingWin = true;
                winOffset.x = e.clientX - win.offsetLeft;
                winOffset.y = e.clientY - win.offsetTop;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDraggingWin) return;
                win.style.left = `${e.clientX - winOffset.x}px`;
                win.style.top = `${e.clientY - winOffset.y}px`;
            });

            window.addEventListener('mouseup', () => { isDraggingWin = false; });
        }

        // --- CONTEXT MENUS & OUTSIDE-CLICK AUTO CLOSE ---
        const contextMenu = document.getElementById('context-menu');
        
        window.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            currentTargetFolderId = null; 

            // Save raw click location for precise element spawning
            let snappedX = Math.round(e.clientX / GRID) * GRID;
            let snappedY = Math.round(e.clientY / GRID) * GRID;
            spawnCoordinates = { x: snappedX, y: snappedY };

            showContextMenu(e, false);
        });

        // Click anywhere to dismiss context menu or active window
        window.addEventListener('click', (e) => { 
            contextMenu.style.display = 'none'; 
            
            // Auto close pop-up window when clicking empty canvas space
            if (!e.target.closest('.window') && !e.target.closest('.desktop-item')) {
                closeActiveWindow();
            }
        });

        function showContextMenu(e, isInsideWindow) {
            contextMenu.style.display = 'block';
            contextMenu.style.left = `${e.clientX}px`;
            contextMenu.style.top = `${e.clientY}px`;
            
            contextMenu.innerHTML = `
                <div class="menu-item" onclick="openPrompt('folder', ${isInsideWindow})">New Folder</div>
                <div class="menu-item" onclick="openPrompt('link', ${isInsideWindow})">New Bookmark</div>
                <div class="menu-separator"></div>
                <div class="menu-item" onclick="toggleSettings(true)">System Configurations</div>
            `;
        }

        function showDeleteMenu(e, id) {
            contextMenu.style.display = 'block';
            contextMenu.style.left = `${e.clientX}px`;
            contextMenu.style.top = `${e.clientY}px`;
            contextMenu.innerHTML = `
                <div class="menu-item" onclick="openRenamePrompt('${id}')">Rename Entry</div>
                <div class="menu-separator"></div>
                <div class="menu-item" style="color:#ef4444;" onclick="deleteItem('${id}')">Purge Entry</div>
            `;
        }

        function openRenamePrompt(id) {
            const item = state.items.find(i => i.id === id);
            if (!item) return;

            activePromptType = 'rename';
            promptOverlay.style.display = 'flex';
            promptIn1.value = item.label;
            promptIn2.style.display = 'none';
            promptTitle.innerText = "Modify Entry Descriptor";
            promptIn1.focus();

            promptConfirm.onclick = function() {
                const newLabel = promptIn1.value.trim();
                if (!newLabel) return;
                item.label = newLabel;
                saveMemory();
                closePrompt();
                
                renderCanvas();
                if (item.parentId) {
                    const contentEl = document.getElementById(`win-content-${item.parentId}`);
                    if (contentEl) renderWindowContent(item.parentId, contentEl);
                }
                const activeWinTitle = document.getElementById('win-title-text');
                if (activeWinTitle && folderHistoryStack[folderHistoryStack.length - 1] === item.id) {
                    activeWinTitle.innerText = newLabel;
                }
            };
        }

        function deleteItem(id) {
            state.items = state.items.filter(i => i.id !== id && i.parentId !== id);
            saveMemory();
            renderCanvas();
            if (folderHistoryStack.includes(id)) {
                closeActiveWindow();
            }
        }

        // --- PROMPT ENGINE ---
        const promptOverlay = document.getElementById('prompt-overlay');
        const promptTitle = document.getElementById('prompt-title');
        const promptIn1 = document.getElementById('prompt-input-1');
        const promptIn2 = document.getElementById('prompt-input-2');
        const promptConfirm = document.getElementById('prompt-confirm');

        let activePromptType = 'folder';
        let activePromptInsideWindow = false;

        function openPrompt(type, insideWindow = false) {
            activePromptType = type;
            activePromptInsideWindow = insideWindow;
            promptOverlay.style.display = 'flex';
            promptIn1.value = '';
            promptIn2.value = '';

            promptConfirm.onclick = executeCreation;

            if (type === 'folder') {
                promptTitle.innerText = "Initialize Directory Cluster";
                promptIn1.placeholder = "Folder Descriptor Tag";
                promptIn2.style.display = 'none';
            } else {
                promptTitle.innerText = "Establish Target Entry Path";
                promptIn1.placeholder = "Bookmark Reference Tag";
                promptIn2.placeholder = "Absolute Pointer URI (https://...)";
                promptIn2.style.display = 'block';
            }
            promptIn1.focus();
        }

        function closePrompt() { promptOverlay.style.display = 'none'; }

        promptIn1.addEventListener('keydown', (e) => { if(e.key === 'Enter') promptConfirm.click(); });
        promptIn2.addEventListener('keydown', (e) => { if(e.key === 'Enter') promptConfirm.click(); });

        function executeCreation() {
            const label = promptIn1.value.trim();
            let url = promptIn2.value.trim();
            if (!label) return;

            const newId = Date.now().toString();
            let parent = activePromptInsideWindow ? folderHistoryStack[folderHistoryStack.length - 1] : null;

            if (activePromptType === 'link') {
                if (!url) return;
                if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
            }

            const newItem = {
                id: newId,
                type: activePromptType,
                label: label,
                parentId: parent,
                x: parent ? 0 : spawnCoordinates.x,
                y: parent ? 0 : spawnCoordinates.y
            };

            if (activePromptType === 'link') newItem.url = url;

            state.items.push(newItem);
            saveMemory();
            closePrompt();

            if (parent) {
                const contentEl = document.getElementById(`win-content-${parent}`);
                if (contentEl) renderWindowContent(parent, contentEl);
            } else {
                renderCanvas();
            }
        }

        // --- COMMAND PALETTE ENGINE (CTRL + K) ---
        const searchPalette = document.getElementById('search-palette');
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        let filteredItems = [];

        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                if (searchPalette.style.display === 'flex') {
                    closeSearchPalette();
                } else {
                    searchPalette.style.display = 'flex';
                    searchInput.value = '';
                    searchResults.innerHTML = '';
                    searchInput.focus();
                    filteredItems = [];
                    searchIndex = 0;
                }
            }
            if (e.key === 'Escape') {
                closeSearchPalette();
                toggleSettings(false);
            }
        });

        searchInput.addEventListener('input', () => {
            const query = searchInput.value.toLowerCase().trim();
            searchResults.innerHTML = '';
            searchIndex = 0;

            if (!query) { filteredItems = []; return; }

            filteredItems = state.items.filter(item => 
                item.label.toLowerCase().includes(query) || 
                (item.type === 'link' && item.url.toLowerCase().includes(query))
            );

            if(filteredItems.length === 0) {
                searchResults.innerHTML = `<div style="padding:12px; font-size:11px; color:var(--text-muted); text-transform:uppercase;">No structural matches identified</div>`;
                return;
            }

            filteredItems.forEach((item, index) => {
                const el = document.createElement('div');
                el.className = `search-result-item ${index === 0 ? 'selected' : ''}`;
                
                if (item.type === 'folder') {
                    el.innerHTML = `📁 <span style="margin-left:5px;">${item.label}</span> <span style="margin-left:auto; font-size:10px; color:var(--text-muted);">DIRECTORY</span>`;
                } else {
                    el.innerHTML = `🔗 <span style="margin-left:5px;">${item.label}</span> <span style="margin-left:auto; font-size:10px; color:var(--text-muted); max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.url}</span>`;
                }

                el.addEventListener('click', () => triggerSearchSelection(item));
                searchResults.appendChild(el);
            });
        });

        searchInput.addEventListener('keydown', (e) => {
            if (filteredItems.length === 0) return;

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                changeSearchSelection(1);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                changeSearchSelection(-1);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                triggerSearchSelection(filteredItems[searchIndex]);
            }
        });

        function changeSearchSelection(dir) {
            const items = searchResults.querySelectorAll('.search-result-item');
            if(items.length === 0) return;
            items[searchIndex].classList.remove('selected');
            searchIndex = (searchIndex + dir + filteredItems.length) % filteredItems.length;
            items[searchIndex].classList.add('selected');
            items[searchIndex].scrollIntoView({ block: 'nearest' });
        }

        function triggerSearchSelection(item) {
            closeSearchPalette();
            if (item.type === 'folder') {
                launchFolderWindow(item.id);
            } else {
                window.open(item.url, '_blank', 'noopener,noreferrer');
            }
        }

        function closeSearchPalette() { searchPalette.style.display = 'none'; }

        // --- BACKUP & SETTINGS DATA ENGINE ---
        function toggleSettings(show) {
            document.getElementById('settings-modal').style.display = show ? 'block' : 'none';
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `bookbar_backup_${Date.now()}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function triggerImport() {
            document.getElementById('import-file-holder').click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.items && parsed.config) {
                        state = parsed;
                        saveMemory();
                        applyConfig();
                        renderCanvas();
                        closeActiveWindow();
                        toggleSettings(false);
                    } else {
                        alert("Malformed data architectural mapping signature.");
                    }
                } catch (err) {
                    alert("Execution fault reading payload file structure.");
                }
            };
            reader.readAsText(file);
        }

        // Start initialization process
        initMemory();
    </script>
</body>
</html>
